name: Agent task
description: Work that is specific enough for Claude to implement as a draft PR.
title: "[Agent task] "
body:
  - type: markdown
    attributes:
      value: |
        Fill in every section. Claude treats this issue as its specification.
        Add the `ready-for-agent` label when the task is ready to start.
        Never paste real statement data, account numbers or transaction text.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is wrong or missing, and why it matters.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist of observable results that mean the task is done.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What Claude must not change or add.
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: The tests to add and any manual checks. Use synthetic data only.
    validations:
      required: true
