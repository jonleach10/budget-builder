name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Placeholders only. The build needs these to exist, not to work.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  # Claude may never change these paths. The job checks the PR's file list
  # through the API and never checks out or runs the PR's code.
  # It runs for pull requests opened by Claude. The head-branch prefix and the
  # github-actions[bot] author are extra triggers, in case the action's PR is
  # attributed to a different identity than claude[bot].
  agent-path-guard:
    name: Agent path guard
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.pull_request.user.login == 'claude[bot]' ||
      github.event.pull_request.user.login == 'github-actions[bot]' ||
      startsWith(github.event.pull_request.head.ref, 'claude/'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Fail if the PR touches protected paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Both the new and the previous name, so a rename out of a protected path is caught.
          files="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"
          blocked=""
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              .github/*|.claude/agents/*|supabase/migrations/*|features/auth/*|app/login/*|proxy.ts|lib/supabase*|*.sql)
                blocked="${blocked}${f}"$'\n'
                ;;
            esac
          done <<< "$files"
          if [ -n "$blocked" ]; then
            echo "::error::This PR changes paths that Claude is never allowed to change."
            echo "Protected paths touched:"
            printf '%s' "$blocked"
            exit 1
          fi
          echo "No protected paths changed."
